# Daily package and lock updates. Managed org-wide; see netsecdevio/.github.
#
# Updates are grouped so a day produces a few reviewable PRs rather than
# dozens. Major bumps stay separate because they need a human decision.
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "gomod"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      gomod-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
  - package-ecosystem: "npm"
    directories:
      - "/npm/slack-mcp-server"
      - "/npm/slack-mcp-server-darwin-amd64"
      - "/npm/slack-mcp-server-darwin-arm64"
      - "/npm/slack-mcp-server-linux-amd64"
      - "/npm/slack-mcp-server-linux-arm64"
      - "/npm/slack-mcp-server-windows-amd64"
      - "/npm/slack-mcp-server-windows-arm64"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "type: chore"
      - "automated"
